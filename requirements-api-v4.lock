# Dependances du service API V4 uniquement (pricing et recommandation).
#
# Perimetre volontairement reduit : ce fichier ne contient QUE ce que
# `api_v4.main` importe reellement au demarrage, determine par inspection des
# modules charges et non par supposition. Il exclut notamment les dependances
# d'entrainement et de restitution (statsforecast, mlforecast, optuna, dash,
# plotly, XlsxWriter) ainsi que les pilotes de base de donnees (supabase,
# psycopg2, SQLAlchemy) : le service n'ouvre aucune connexion base de donnees.
#
# Cette reduction est deliberee : le plan gratuit de la plateforme de
# deploiement est limite en memoire, et installer la totalite de
# `requirements.txt` y ferait peser des paquets inutiles au service.
#
# Versions figees sur celles ayant servi a entrainer et serialiser les modeles,
# pour garantir que les artefacts joblib se rechargent a l'identique.

