[tool.pytest.ini_options]
testpaths = ["tests", "v2/tests", "api/tests"]
pythonpath = ["."]
markers = ["docker: tests d'intégration nécessitant un daemon Docker disponible"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "^(tests|v2|src)/"
